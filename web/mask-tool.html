<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sagalore — screenshot mask tool</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1018;
    --panel: #141b27;
    --ink: #e8e2d6;
    --muted: #9aa3b2;
    --gold: #d4a84b;
    --line: #2a3548;
    --accent: #5ad1a0;
    --toast: #f0d078;
    --frame: #6ec8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1rem;
    padding: 0.85rem 1.1rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 650;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }
  button, select {
    appearance: none;
    border: 1px solid var(--line);
    background: #1b2433;
    color: var(--ink);
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    font: inherit;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #3d4d66; }
  button.primary {
    background: #243652;
    border-color: #3d5a82;
  }
  button.active {
    border-color: var(--gold);
    color: var(--gold);
  }
  label.dim {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
    font-size: 0.82rem;
  }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 0;
    min-height: calc(100vh - 64px);
  }
  .stage-wrap {
    padding: 1rem;
    overflow: auto;
    background: #070b12;
  }
  .stage {
    position: relative;
    display: inline-block;
    line-height: 0;
    user-select: none;
    cursor: crosshair;
    max-width: 100%;
  }
  .stage img {
    display: block;
    max-width: 100%;
    height: auto;
    pointer-events: none;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .side {
    border-left: 1px solid var(--line);
    background: var(--panel);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .side h2 {
    margin: 0;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rect {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.7rem 0.75rem;
    background: #101722;
  }
  .rect.frame { border-color: rgba(110, 200, 255, 0.45); }
  .rect.toast { border-color: rgba(240, 208, 120, 0.45); }
  .rect .name {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.45rem;
    font-weight: 600;
  }
  .swatch {
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 2px;
    display: inline-block;
  }
  .swatch.frame { background: var(--frame); }
  .swatch.toast { background: var(--toast); }
  .coords {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    color: var(--ink);
    word-break: break-all;
  }
  .hint {
    color: var(--muted);
    font-size: 0.8rem;
  }
  pre {
    margin: 0;
    padding: 0.7rem;
    border-radius: 8px;
    background: #0a0f16;
    border: 1px solid var(--line);
    font: 0.72rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    color: #c9d4e4;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Screenshot mask tool</h1>
    <p>Drag to draw. Switch mode for frame / toast. Coords are image pixels.</p>
  </div>
  <div class="row">
    <label>
      Image
      <select id="image-select">
        <option value="/assets/shot-saga-raw.jpg">shot-saga-raw.jpg</option>
        <option value="/assets/shot-complete-raw.jpg">shot-complete-raw.jpg</option>
      </select>
    </label>
    <button type="button" id="mode-frame" class="active">Frame</button>
    <button type="button" id="mode-toast">Toast</button>
    <label class="dim"><input type="checkbox" id="preview-dim" checked> Preview dim</label>
    <label class="dim">Dim <input type="range" id="dim-level" min="10" max="50" value="30"></label>
  </div>
</header>
<main>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <img id="shot" alt="Screenshot to mask" draggable="false">
      <canvas id="overlay"></canvas>
    </div>
  </div>
  <aside class="side">
    <h2>Rectangles</h2>
    <div class="rect frame">
      <div class="name"><span><span class="swatch frame"></span> Frame</span><button type="button" id="clear-frame">Clear</button></div>
      <div class="coords" id="frame-coords">—</div>
    </div>
    <div class="rect toast">
      <div class="name"><span><span class="swatch toast"></span> Toast</span><button type="button" id="clear-toast">Clear</button></div>
      <div class="coords" id="toast-coords">—</div>
    </div>
    <p class="hint">Click-drag on the image. Each drag replaces the rectangle for the selected mode (Frame or Toast).</p>
    <h2>Export</h2>
    <pre id="export">PANEL = None
TOAST = None</pre>
    <div class="actions">
      <button type="button" class="primary" id="copy-py">Copy Python</button>
      <button type="button" id="copy-json">Copy JSON</button>
    </div>
    <p class="hint">Natural size: <span id="nat-size">—</span></p>
  </aside>
</main>
<script>
(() => {
  const img = document.getElementById("shot");
  const canvas = document.getElementById("overlay");
  const stage = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const select = document.getElementById("image-select");
  const previewDim = document.getElementById("preview-dim");
  const dimLevel = document.getElementById("dim-level");
  const exportEl = document.getElementById("export");
  const natSize = document.getElementById("nat-size");

  const defaults = {
    "/assets/shot-saga-raw.jpg": { frame: [573, 141, 993, 455], toast: null },
    "/assets/shot-complete-raw.jpg": { frame: [597, 141, 1014, 453], toast: [395, 37, 626, 92] },
  };

  let mode = "frame"; // frame | toast
  let frame = null;
  let toast = null;
  let drag = null; // {x0,y0,x1,y1} in natural pixels
  let natural = { w: 1, h: 1 };

  function loadDefaults() {
    const d = defaults[select.value] || { frame: null, toast: null };
    frame = d.frame ? d.frame.slice() : null;
    toast = d.toast ? d.toast.slice() : null;
  }

  function setMode(next) {
    mode = next;
    document.getElementById("mode-frame").classList.toggle("active", mode === "frame");
    document.getElementById("mode-toast").classList.toggle("active", mode === "toast");
  }

  function fmt(r) {
    if (!r) return "—";
    const [x0, y0, x1, y1] = r;
    return `(${x0}, ${y0}, ${x1}, ${y1})  ·  ${x1 - x0 + 1}×${y1 - y0 + 1}`;
  }

  function updateSide() {
    document.getElementById("frame-coords").textContent = fmt(frame);
    document.getElementById("toast-coords").textContent = fmt(toast);
    const pyFrame = frame ? `PANEL = (${frame.join(", ")})` : "PANEL = None";
    const pyToast = toast ? `TOAST = (${toast.join(", ")})` : "TOAST = None";
    exportEl.textContent = `${pyFrame}\n${pyToast}\n# image: ${select.value}\n# size: ${natural.w}×${natural.h}`;
  }

  function displayScale() {
    const rect = img.getBoundingClientRect();
    return {
      sx: natural.w / rect.width,
      sy: natural.h / rect.height,
      rect,
    };
  }

  function toNatural(clientX, clientY) {
    const { sx, sy, rect } = displayScale();
    const x = Math.round(Math.min(Math.max(clientX - rect.left, 0), rect.width) * sx);
    const y = Math.round(Math.min(Math.max(clientY - rect.top, 0), rect.height) * sy);
    return {
      x: Math.min(Math.max(x, 0), natural.w - 1),
      y: Math.min(Math.max(y, 0), natural.h - 1),
    };
  }

  function normRect(x0, y0, x1, y1) {
    const a = Math.min(x0, x1);
    const b = Math.min(y0, y1);
    const c = Math.max(x0, x1);
    const d = Math.max(y0, y1);
    return [a, b, c, d];
  }

  function drawRect(r, color, fill) {
    if (!r) return;
    const [x0, y0, x1, y1] = r;
    const w = x1 - x0 + 1;
    const h = y1 - y0 + 1;
    ctx.save();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fillRect(x0, y0, w, h);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, natural.w / 500);
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, w - 1, h - 1);
    ctx.restore();
  }

  function paint() {
    canvas.width = natural.w;
    canvas.height = natural.h;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (previewDim.checked) {
      const dim = Number(dimLevel.value) / 100;
      ctx.fillStyle = `rgba(0,0,0,${1 - dim})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = "destination-out";
      const punch = (r) => {
        if (!r) return;
        const [x0, y0, x1, y1] = r;
        ctx.fillStyle = "#000";
        ctx.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
      };
      punch(frame);
      punch(toast);
      if (drag) punch(normRect(drag.x0, drag.y0, drag.x1, drag.y1));
      ctx.globalCompositeOperation = "source-over";
    }

    drawRect(frame, "#6ec8ff", "rgba(110,200,255,0.08)");
    drawRect(toast, "#f0d078", "rgba(240,208,120,0.10)");
    if (drag) {
      const live = normRect(drag.x0, drag.y0, drag.x1, drag.y1);
      drawRect(live, mode === "frame" ? "#6ec8ff" : "#f0d078", "rgba(255,255,255,0.08)");
    }
    updateSide();
  }

  function onPointerDown(e) {
    if (e.button !== 0) return;
    stage.setPointerCapture(e.pointerId);
    const p = toNatural(e.clientX, e.clientY);
    drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    paint();
  }
  function onPointerMove(e) {
    if (!drag) return;
    const p = toNatural(e.clientX, e.clientY);
    drag.x1 = p.x;
    drag.y1 = p.y;
    paint();
  }
  function onPointerUp(e) {
    if (!drag) return;
    const r = normRect(drag.x0, drag.y0, drag.x1, drag.y1);
    const tooSmall = (r[2] - r[0] < 4) || (r[3] - r[1] < 4);
    if (!tooSmall) {
      if (mode === "frame") frame = r;
      else toast = r;
    }
    drag = null;
    paint();
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  }

  stage.addEventListener("pointerdown", onPointerDown);
  stage.addEventListener("pointermove", onPointerMove);
  stage.addEventListener("pointerup", onPointerUp);
  stage.addEventListener("pointercancel", onPointerUp);

  document.getElementById("mode-frame").onclick = () => setMode("frame");
  document.getElementById("mode-toast").onclick = () => setMode("toast");
  document.getElementById("clear-frame").onclick = () => { frame = null; paint(); };
  document.getElementById("clear-toast").onclick = () => { toast = null; paint(); };
  previewDim.onchange = paint;
  dimLevel.oninput = paint;

  async function copyText(text) {
    await navigator.clipboard.writeText(text);
  }
  document.getElementById("copy-py").onclick = async () => {
    await copyText(exportEl.textContent);
    document.getElementById("copy-py").textContent = "Copied";
    setTimeout(() => { document.getElementById("copy-py").textContent = "Copy Python"; }, 900);
  };
  document.getElementById("copy-json").onclick = async () => {
    const payload = {
      image: select.value,
      width: natural.w,
      height: natural.h,
      panel: frame,
      toast,
    };
    await copyText(JSON.stringify(payload, null, 2));
    document.getElementById("copy-json").textContent = "Copied";
    setTimeout(() => { document.getElementById("copy-json").textContent = "Copy JSON"; }, 900);
  };

  function loadImage(src) {
    img.onload = () => {
      natural = { w: img.naturalWidth, h: img.naturalHeight };
      natSize.textContent = `${natural.w}×${natural.h}`;
      loadDefaults();
      paint();
    };
    img.src = src + (src.includes("?") ? "&" : "?") + "v=" + Date.now();
  }

  select.onchange = () => loadImage(select.value);
  window.addEventListener("resize", paint);

  setMode("frame");
  loadImage(select.value);
})();
</script>
</body>
</html>
