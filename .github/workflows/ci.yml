name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gutsaga
          POSTGRES_PASSWORD: gutsaga
          POSTGRES_DB: gutsaga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gutsaga -d gutsaga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gutsaga:gutsaga@localhost:5432/gutsaga_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build API and Windows companion
        run: |
          CGO_ENABLED=0 go build -o /tmp/gutsaga-api ./api
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/gutsaga.exe ./cmd/gutsaga
      - name: luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
          luacheck addon
          lua5.1 addon/objectives_test.lua
          lua5.1 addon/chains_test.lua

  package:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: gutsaga-darwin-arm64
            cgo: "1"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: gutsaga-darwin-amd64
            cgo: "1"
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: gutsaga-windows-amd64.exe
            cgo: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build companion
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          if [ "$GOOS" = "darwin" ] && [ "$GOARCH" = "amd64" ]; then
            export CC="clang -arch x86_64"
            SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            export SDKROOT
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/magnusnilsen/gutsaga/internal/version.Version=${VERSION}" -o "dist/${{ matrix.asset }}" ./cmd/gutsaga
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, package]
    runs-on: ubuntu-latest
    env:
      # steps.if cannot read secrets. GitHub rejects the workflow and the run
      # has zero jobs. Map the secrets here and test env.* on the mirror step.
      PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
      PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package addon and checksums
        run: |
          (cd addon && zip -r ../dist/GutSaga-addon.zip GutSaga)
          cd dist
          sha256sum ./* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          notes=$(cat <<EOF
          GutSaga ${VERSION}

          - \`gutsaga-darwin-arm64\` og \`gutsaga-darwin-amd64\` (macOS)
          - \`gutsaga-windows-amd64.exe\`
          - \`GutSaga-addon.zip\`

          Binærene er ikke signert. Se README for Gatekeeper og SmartScreen.
          EOF
          )
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
          else
            gh release create "v${VERSION}" dist/* --title "GutSaga v${VERSION}" --notes "$notes"
          fi
      - name: Mirror to public releases repo
        if: env.PUBLIC_RELEASE_REPO != '' && env.PUBLIC_RELEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          VERSION: 0.1.${{ github.run_number }}
          REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
        run: |
          if gh release view "v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --repo "$REPO" --clobber
          else
            gh release create "v${VERSION}" dist/* --repo "$REPO" --title "GutSaga v${VERSION}" --notes "GutSaga ${VERSION}"
          fi
