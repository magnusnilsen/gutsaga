# Local development only. Railway does not use this file — it builds api/Dockerfile
# via railway.json and takes ADMIN_TOKEN / IMAGE_URL_SECRET from the Railway dashboard.
# The known defaults below (dev-admin-token, …) are rejected at API startup unless
# GUTSAGA_ALLOW_DEV_SECRETS=1, so they cannot silently ship to production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gutsaga
      POSTGRES_PASSWORD: gutsaga
      POSTGRES_DB: gutsaga
    ports:
      - "5432:5432"
    volumes:
      - gutsaga-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gutsaga -d gutsaga"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://gutsaga:gutsaga@postgres:5432/gutsaga?sslmode=disable
      ADMIN_TOKEN: dev-admin-token
      IMAGE_URL_SECRET: dev-image-url-secret
      GUTSAGA_ALLOW_DEV_SECRETS: "1"
      PUBLIC_BASE_URL: http://localhost:8080
      GUTSAGA_DEV_TOKEN: dev-token
      # slug:Name for the local tutorial group. A fresh database does nothing until seed creates sagas.
      GUTSAGA_BOOTSTRAP_GROUP: tutorial:Tutorial
      # Optional: copied once onto the bootstrap group when its webhook is empty.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gutsaga-pg:
