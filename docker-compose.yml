# Local development only. Railway does not use this file — it builds api/Dockerfile
# via railway.json and takes ADMIN_TOKEN / IMAGE_URL_SECRET from the Railway dashboard.
# The known defaults below (dev-admin-token, …) are rejected at API startup unless
# SAGALORE_ALLOW_DEV_SECRETS=1, so they cannot silently ship to production.
# OURSAGAS_* is the previous name and is still accepted by the API.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gutsaga
      POSTGRES_PASSWORD: gutsaga
      POSTGRES_DB: gutsaga
    ports:
      - "5432:5432"
    volumes:
      - gutsaga-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gutsaga -d gutsaga"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://gutsaga:gutsaga@postgres:5432/gutsaga?sslmode=disable
      ADMIN_TOKEN: dev-admin-token
      IMAGE_URL_SECRET: dev-image-url-secret
      SAGALORE_ALLOW_DEV_SECRETS: "1"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SAGALORE_DEV_TOKEN: ${SAGALORE_DEV_TOKEN:-${OURSAGAS_DEV_TOKEN:-}}
      SAGALORE_MCP_SERVICE_SECRET: ${SAGALORE_MCP_SERVICE_SECRET:-${OURSAGAS_MCP_SERVICE_SECRET:-}}
      SAGALORE_SMIA_ISSUER: ${SAGALORE_SMIA_ISSUER:-${OURSAGAS_SMIA_ISSUER:-https://smia.tools}}
      SAGALORE_REQUIRE_SMIA_JWT: ${SAGALORE_REQUIRE_SMIA_JWT:-${OURSAGAS_REQUIRE_SMIA_JWT:-}}
      BNET_CLIENT_ID: ${BNET_CLIENT_ID:-}
      BNET_CLIENT_SECRET: ${BNET_CLIENT_SECRET:-}
      # slug:Name for the local tutorial group. A fresh database does nothing until seed creates sagas.
      SAGALORE_BOOTSTRAP_GROUP: ${SAGALORE_BOOTSTRAP_GROUP:-${OURSAGAS_BOOTSTRAP_GROUP:-tutorial:Tutorial}}
      # Optional: copied once onto the bootstrap group when its webhook is empty.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gutsaga-pg:
