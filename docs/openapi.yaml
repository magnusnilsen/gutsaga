openapi: 3.0.3
info:
  title: Sagalore API
  version: "0.2.0"
  description: |
    Battle.net login, groups, and sagas. Sessions are gss_. Personal tokens are gst_.
    ADMIN_TOKEN cannot author sagas. See docs/API.md.
servers:
  - url: https://sagalore.example.com
paths:
  /healthz:
    get:
      summary: Database health
      responses:
        "200":
          description: ok
  /v1/auth/bnet/start:
    get:
      summary: Redirect to Battle.net authorize (PKCE, openid wow.profile)
      parameters:
        - in: query
          name: attempt
          required: true
          schema: {type: string}
      responses:
        "302":
          description: Redirect to https://oauth.battle.net/authorize
  /v1/auth/bnet/callback:
    get:
      summary: Exchange the code and store a gss_ session on the attempt
      responses:
        "200":
          description: HTML the player can close
  /v1/auth/bnet/poll:
    get:
      summary: Poll the attempt
      parameters:
        - in: query
          name: attempt
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Session
        "202":
          description: Pending
  /v1/auth/dev:
    post:
      summary: Dev token bypass. Does not call Blizzard.
      responses:
        "200":
          description: Session
        "401":
          description: Bad token
  /v1/groups:
    get:
      summary: Groups for the signed-in account
      responses:
        "200":
          description: groups
    post:
      summary: Create a group
      responses:
        "201":
          description: created
  /v1/groups/{id}/invites:
    post:
      summary: Owner invites a character
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "201":
          description: pending invite
  /v1/invites/{id}/accept:
    post:
      summary: Accept. Joins the account and marks the character participating.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: accepted
  /v1/invites/{id}/decline:
    post:
      summary: Decline. Permanent for this invite.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: declined
  /v1/sagas:
    get:
      summary: Sagas in the caller's groups
      responses:
        "200":
          description: sagas
    post:
      summary: Create a saga. group is a slug, or omitted when the player has one group.
      responses:
        "201":
          description: created
        "403":
          description: not a member
  /v1/sync:
    get:
      summary: Sagas, progress, and completions for the caller's groups
      responses:
        "200":
          description: sync
  /v1/me/tokens:
    post:
      summary: Mint a gst_ token. Returned once.
      responses:
        "201":
          description: token
  /v1/admin/groups/{id}:
    delete:
      summary: Ops. Delete the group and its sagas.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "204":
          description: deleted
  /v1/admin/sagas/{id}:
    delete:
      summary: Ops. Hard-delete one saga.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "204":
          description: deleted
